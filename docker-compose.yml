version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: tubes-pbol
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tubespbol
      MYSQL_USER: root
      MYSQL_PASSWORD: umihebat
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
